name: release

# Pushing a tag vX.Y.Z publishes a GitHub release whose notes are that version's
# section of CHANGELOG.md. The tag must point at a commit on main.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check the footer shows this version
        run: grep -q "id=\"app-version\" href=\"https://github.com/getclosr-link/getclosr/releases/tag/${GITHUB_REF_NAME}\"[^>]*>${GITHUB_REF_NAME}<" public/index.html
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "getClosr $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
